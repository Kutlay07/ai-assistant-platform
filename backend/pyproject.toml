[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant"
version = "1.2.0"
description = "Production-ready AI Assistant Framework"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Kutlay" }
]

dependencies = [
    # Web API
    "fastapi[standard]>=0.118.0",
    "uvicorn>=0.37.0",
    "redis>=5.0.0",

    # LLM
    "openai>=2.0.0",

    # Configuration
    "python-dotenv>=1.1.0",

    # Validation
    "pydantic>=2.11.0",

    "sentence-transformers",
    "psycopg[binary]",
    "pgvector",
    "rank-bm25",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]

dev = [
    "pytest>=8.4.0",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"