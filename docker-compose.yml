services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - path: .env
        required: false

    environment:
      HF_HOME: /root/.cache/huggingface
      MEMORY_PATH: ${MEMORY_PATH:-data/conversation.json}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_CONNECTION_STRING: >-
        ${POSTGRES_CONNECTION_STRING:-postgresql://ai_assistant:ai_assistant@postgres:5432/ai_assistant}

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ai_assistant
      POSTGRES_PASSWORD: ai_assistant
      POSTGRES_DB: ai_assistant
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_assistant -d ai_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  huggingface_cache:
  backend_data:
